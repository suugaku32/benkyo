name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/clone-scb-analyseur-lrnli4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Volontairement `false`. Annuler la publication en cours est le bon réflexe
  # quand elles durent quelques secondes : seule la dernière compte. Mais quand
  # la file d'attente de GitHub s'allonge, chaque poussée tue la précédente et
  # plus rien n'aboutit — c'est arrivé plusieurs fois de suite, le site restant
  # silencieusement en arrière. Mieux vaut une file qui se vide lentement qu'une
  # file qui se vide dans le néant.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
